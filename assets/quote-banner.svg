<svg width="260" height="220" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="visor" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </radialGradient>
  </defs>

  <rect width="260" height="220" rx="14" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="20" cy="24" r="1.6" fill="#ffffff"/>
  <circle cx="60" cy="12" r="1.2" fill="#ffffff"/>
  <circle cx="230" cy="30" r="1.6" fill="#ffffff"/>
  <circle cx="200" cy="60" r="1.2" fill="#ffffff"/>
  <circle cx="35" cy="80" r="1.2" fill="#ffffff"/>
  <circle cx="245" cy="120" r="1.4" fill="#ffffff"/>
  <circle cx="15" cy="150" r="1.2" fill="#ffffff"/>

  <!-- small planet -->
  <circle cx="215" cy="45" r="14" fill="#f472b6" opacity="0.85"/>
  <ellipse cx="215" cy="45" rx="24" ry="6" fill="none" stroke="#f9a8d4" stroke-width="2" opacity="0.7"/>

  <!-- moon surface -->
  <ellipse cx="130" cy="205" rx="140" ry="22" fill="#0f0824"/>

  <!-- astronaut body -->
  <g transform="translate(80,90)">
    <!-- backpack -->
    <rect x="30" y="35" width="20" height="45" rx="6" fill="#4c1d95"/>
    <!-- body -->
    <ellipse cx="50" cy="65" rx="34" ry="40" fill="url(#suit)"/>
    <!-- legs -->
    <rect x="30" y="95" width="14" height="28" rx="6" fill="#7c3aed"/>
    <rect x="56" y="95" width="14" height="28" rx="6" fill="#7c3aed"/>
    <!-- arm reaching to laptop -->
    <path d="M20,55 Q0,65 5,85" stroke="url(#suit)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- helmet -->
    <circle cx="50" cy="25" r="30" fill="#e5e7eb"/>
    <circle cx="47" cy="25" r="21" fill="url(#visor)"/>
    <!-- visor reflection -->
    <ellipse cx="40" cy="17" rx="6" ry="4" fill="#ffffff" opacity="0.6"/>
    <!-- laptop -->
    <g transform="translate(-25,80)">
      <rect x="0" y="10" width="34" height="4" rx="1" fill="#e5e7eb"/>
      <path d="M2,10 L6,-16 L30,-16 L34,10 Z" fill="#111827"/>
      <rect x="9" y="-14" width="18" height="20" fill="#38bdf8"/>
    </g>
  </g>

  <!-- flag -->
  <g transform="translate(190,150)">
    <rect x="0" y="0" width="3" height="40" fill="#d1d5db"/>
    <path d="M3,2 L30,8 L3,16 Z" fill="#f472b6"/>
  </g>
</svg>
